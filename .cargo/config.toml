# Cross-compile CC settings — Gentoo LLVM 21 toolchain
[env]
CC_x86_64_unknown_linux_musl = "/usr/lib/llvm/21/bin/x86_64-unknown-linux-musl-clang"
CC_aarch64_unknown_linux_musl = "/usr/lib/llvm/21/bin/aarch64-unknown-linux-musl-clang"
CC_x86_64_pc_windows_gnu = "/usr/bin/x86_64-w64-mingw32-gcc"

[target.x86_64-unknown-linux-musl]
linker = "/usr/lib/llvm/21/bin/ld.lld"

[target.aarch64-unknown-linux-musl]
linker = "/usr/lib/llvm/21/bin/ld.lld"

[target.x86_64-pc-windows-gnu]
linker = "/usr/bin/x86_64-w64-mingw32-gcc"
